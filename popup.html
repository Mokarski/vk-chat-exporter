<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 520px; font-family: sans-serif; padding: 10px; }
        button { width: 100%; margin-bottom: 6px; padding: 8px; }
        #status { font-size: 12px; color: #555; margin-top: 6px; word-break: break-word; }
        #debugWrap { margin-top: 8px; }
        #debug {
            width: 100%; height: 220px; font-family: monospace; font-size: 11px;
            white-space: pre; overflow: auto; border: 1px solid #ccc; padding: 4px;
            box-sizing: border-box; background: #fafafa;
        }
        #peerBox {
            margin: 6px 0; padding: 6px; border: 1px solid #ddd; border-radius: 4px;
            background: #f7f9fc;
        }
        #peerBox label { font-size: 12px; display: block; margin-bottom: 4px; }
        #peerRow { display: flex; gap: 4px; }
        #peerId {
            flex: 1; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px;
            font-family: monospace;
        }
        #btnDetectPeer { width: auto; margin: 0; padding: 4px 8px; }
        #peerHint { font-size: 11px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="peerBox">
        <label><b>ID чата (peer_id)</b> — можно несколько через запятую; пусто = все чаты:</label>
        <div id="peerRow">
            <input id="peerId" type="text" placeholder="например: 2000000073 или c73" autocomplete="off">
            <button id="btnDetectPeer" type="button" title="Определить по URL текущей вкладки">🔍 Определить</button>
        </div>
        <div id="peerHint">Формат: peer_id (2000000073) или параметр ссылки (c73). Кнопка 🔍 подставит ID из открытого чата.</div>
    </div>

    <button id="btnCollect">📥 Собрать сообщения из буфера</button>
    <button id="btnDownloadJson">💾 Скачать JSON</button>
    <button id="btnDownloadMarkdown">📝 Скачать Markdown</button>
    <button id="btnDownloadAtt">📎 Скачать вложения</button>
    <button id="btnClear">🗑 Очистить буфер</button>
    <div id="status">Откройте чат ВК, прокрутите историю вверх, нажмите «Собрать».</div>

    <div id="debugWrap">
        <div style="font-size:12px; margin-top:8px;">
            <b>Отладка</b> (скопируйте всё и пришлите):
            <button id="btnCopyDebug" style="width:auto; padding:2px 8px; margin-left:4px;">Копировать</button>
        </div>
        <textarea id="debug" readonly></textarea>
    </div>

    <script src="popup.js"></script>
</body>
</html>
